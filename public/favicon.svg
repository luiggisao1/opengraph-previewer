<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with High-Contrast Slate Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.75" />

  <!-- Monogram "L" with Smooth Curved Caps & Vertex -->
  <path
    d="M 19 18.5 C 19 16 21 14 23.5 14 C 26 14 28 16 28 18.5 L 28 40 L 44.5 40 C 47 40 49 42 49 44.5 C 49 47 47 49 44.5 49 L 23.5 49 C 21 49 19 47 19 44.5 Z"
    fill="url(#primaryGrad)"
  />

  <!-- High-Contrast Cyan Terminal Pulse Node -->
  <circle cx="44.5" cy="19.5" r="4" fill="url(#dotGrad)" />
</svg>
